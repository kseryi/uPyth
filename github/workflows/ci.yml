name: CI

# Запускається на кожен push і кожен Pull Request — саме той "зелений
# пташок", який показує зовнішньому аудитору (і грантодавцю), що тести
# й лінт реально проходять, а не лише "проходили колись локально".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint
